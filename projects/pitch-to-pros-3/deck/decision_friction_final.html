<h1 id="turn-pass-options-into-decision-window-context">Turn pass options into decision-window context.</h1>
<div class="workflow-layout">
<div class="workflow-steps">
  <div class="workflow-step"><span>1</span><strong>Start with pass candidate options</strong><em>receiver, value, option window</em></div>
  <div class="workflow-step"><span>2</span><strong>Score execution context</strong><em>inside the decision window</em></div>
  <div class="workflow-step"><span>3</span><strong>Return review context</strong><em>best frame, last playable, primary constraint</em></div>
</div>
<div class="algorithm-card">
  <div class="algorithm-head">
    <span>Algorithm</span>
    <strong>pass-window review</strong>
  </div>
  <div class="algorithm-lines">
    <div class="algorithm-line level-0">for each pass event:</div>
    <div class="algorithm-line level-1">define pass frame + carrier window</div>
    <div class="algorithm-line level-1">options = candidates before pass</div>
    <div class="algorithm-gap"></div>
    <div class="algorithm-line level-1">for each option:</div>
    <div class="algorithm-line level-2">score active frames</div>
    <div class="algorithm-line level-2">trace playable value over time</div>
    <div class="algorithm-line level-2">keep peak + pass-frame value</div>
    <div class="algorithm-gap"></div>
    <div class="algorithm-line level-1">return evidence:</div>
    <div class="algorithm-line level-2">ranked pass options</div>
    <div class="algorithm-line level-2">playable value + timing status</div>
  </div>
  <div class="algorithm-foot">Output: top alternatives, playable timing, and what changed before the pass.</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-class="method metric-method" data-theme="vdni4pzq0yfprynkzjcmpw8uqka04q63di0nphnu9b" lang="C" class="method metric-method" style="--class:method metric-method;--theme:vdni4pzq0yfprynkzjcmpw8uqka04q63di0nphnu9b;" data-size="16:9"><div class="kicker">Playability calculation</div>
<h1 id="at-each-frame-five-playability-components-produce-the-score">At each frame, five playability components produce the score.</h1>
<div class="scoring-recipe-layout">
<div class="component-chip-grid">
  <div><strong>Lane</strong><span>Is the path open?</span><code>S_lane</code></div>
  <div><strong>Pressure</strong><span>Can the carrier execute?</span><code>S_pressure</code></div>
  <div><strong>Receiver</strong><span>Is the target free?</span><code>S_receiver</code></div>
  <div><strong>Movement</strong><span>Does the run fit?</span><code>S_movement</code></div>
  <div><strong>Timing</strong><span>Is the option still alive?</span><code>S_timing</code></div>
</div>
<div class="recipe-stack">
  <div class="calc-panel primary">
    <div class="label">Playability score</div>
    <div class="math-line">
      <math display="block">
        <msub><mi>S</mi><mtext>play</mtext></msub><mo>(</mo><mi>o</mi><mo>,</mo><mi>t</mi><mo>)</mo>
        <mo>=</mo>
        <mtext>geometric mean</mtext>
        <mo>(</mo>
        <msub><mi>S</mi><mtext>lane</mtext></msub><mo>,</mo>
        <msub><mi>S</mi><mtext>pressure</mtext></msub><mo>,</mo>
        <msub><mi>S</mi><mtext>receiver</mtext></msub><mo>,</mo>
        <msub><mi>S</mi><mtext>movement</mtext></msub><mo>,</mo>
        <msub><mi>S</mi><mtext>timing</mtext></msub>
        <mo>)</mo>
      </math>
    </div>
    <div class="calc-note">Each component is a 0-1 tracking-derived score. One severe constraint pulls the full score down.</div>
  </div>
  <div class="recipe-value-panel">
    <div><span>Theory</span><strong><i>V</i><sub>theory</sub> = SkillCorner xThreat</strong></div>
    <div><span>Playable value</span><strong><i>V</i><sub>play</sub>(o,t) = <i>V</i><sub>theory</sub>(o) * <i>S</i><sub>play</sub>(o,t)</strong></div>
    <div><span>Decision friction</span><strong><i>F</i><sub>decision</sub>(o,t) = <i>V</i><sub>theory</sub>(o) - <i>V</i><sub>play</sub>(o,t)</strong></div>
  </div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-class="data-scope" data-theme="vdni4pzq0yfprynkzjcmpw8uqka04q63di0nphnu9b" lang="C" class="data-scope" style="--class:data-scope;--theme:vdni4pzq0yfprynkzjcmpw8uqka04q63di0nphnu9b;" data-size="16:9"><div class="kicker">Real match data</div>

    <div><strong>10</strong><span>Australian A-League 2024/25 matches</span></div>

  </div>
</div>
</section>
