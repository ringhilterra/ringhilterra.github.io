<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Temporal support creation framework</title>
  <desc id="desc">A football pitch with player movement trails, support option windows, and a support quality curve.</desc>
  <defs>
